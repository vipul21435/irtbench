[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "irtbench"
version = "0.1.0"
description = "Item response theory for benchmark results: which items separate models, which carry no information, and how small a subset of items predicts the full score."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vipul Raj Jha" }]
keywords = ["item response theory", "benchmark", "evaluation", "rasch", "2pl", "psychometrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "matplotlib>=3.7"]

[project.scripts]
irtbench = "irtbench.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/irtbench"

[tool.hatch.build.targets.wheel]
packages = ["src/irtbench"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["irtbench"]
